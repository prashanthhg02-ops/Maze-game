<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <title>Maze Runner</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10151f;
      --panel: #181f2d;
      --panel-light: #202a3a;
      --text: #f3f6fc;
      --muted: #94a1b5;
      --accent: #85f0c1;
      --gold: #ffd477;
      --wall: #303b50;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, #1c2a39 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, select { font: inherit; }

    .game {
      width: min(100%, 760px);
      padding: clamp(18px, 4vw, 32px);
      border: 1px solid #2a3548;
      border-radius: 24px;
      background: linear-gradient(145deg, #1b2331, #151b27 75%);
      box-shadow: 0 28px 90px #0006, inset 0 1px #ffffff0a;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 2.55rem);
      letter-spacing: -.055em;
      line-height: 1;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .92rem;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .stat {
      min-width: 78px;
      padding: 10px 12px;
      border: 1px solid #ffffff0c;
      border-radius: 13px;
      background: #ffffff07;
      text-align: center;
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: .64rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.02rem;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .board-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid #ffffff12;
      border-radius: 16px;
      background: #111824;
      box-shadow: inset 0 0 35px #0005;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0c121dcc;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .overlay[hidden] { display: none; }

    .overlay-card {
      max-width: 330px;
      padding: 25px;
      border: 1px solid #ffffff1a;
      border-radius: 20px;
      background: #1a2432;
      box-shadow: 0 14px 50px #0006;
    }

    .win-mark { font-size: 2.5rem; }
    .overlay h2 { margin: 8px 0; font-size: 1.65rem; }
    .overlay p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
    }

    .settings {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      color: var(--muted);
      font-size: .82rem;
      font-weight: 650;
    }

    select, .button {
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid #ffffff17;
      border-radius: 11px;
      background: var(--panel-light);
      color: var(--text);
    }

    select { cursor: pointer; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-color: transparent;
      background: var(--accent);
      color: #10251e;
      cursor: pointer;
      font-weight: 800;
      transition: transform .15s ease, filter .15s ease;
    }

    .button:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .button:active { transform: translateY(1px); }
    .button:focus-visible, select:focus-visible { outline: 3px solid #85f0c180; outline-offset: 2px; }

    .hint {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: .8rem;
      text-align: center;
    }

    kbd {
      padding: 3px 6px;
      border: 1px solid #ffffff21;
      border-bottom-width: 2px;
      border-radius: 5px;
      background: #ffffff0a;
      color: #d5deeb;
      font: inherit;
      font-size: .72rem;
    }

    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
      justify-content: center;
      margin-top: 15px;
    }

    .mobile-controls button {
      border: 1px solid #ffffff18;
      border-radius: 11px;
      background: var(--panel-light);
      color: var(--text);
      cursor: pointer;
      font-size: 1.15rem;
      touch-action: manipulation;
    }

    .mobile-controls button:active { background: #344258; }
    .mobile-controls [data-dir="up"] { grid-column: 2; }
    .mobile-controls [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .mobile-controls [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .mobile-controls [data-dir="right"] { grid-column: 3; grid-row: 2; }

    @media (max-width: 520px) {
      body { padding: 14px 10px; }
      .game { padding: 18px 14px; border-radius: 19px; }
      header { flex-direction: column; }
      .stats { width: 100%; }
      .stat { flex: 1; }
      .controls { align-items: stretch; flex-direction: column; }
      .settings { justify-content: space-between; }
      .settings select { flex: 1; }
      .controls > .button { width: 100%; }
      .mobile-controls { display: grid; }
      .hint { line-height: 1.8; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div>
        <p class="eyebrow">A little brain workout</p>
        <h1>Maze Runner</h1>
        <p class="subtitle">Find your way to the glowing exit.</p>
      </div>
      <div class="stats" aria-label="Game statistics">
        <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="timer">00:00</span></div>
        <div class="stat"><span class="stat-label">Steps</span><span class="stat-value" id="steps">0</span></div>
        <div class="stat"><span class="stat-label">Level</span><span class="stat-value" id="level">01</span></div>
      </div>
    </header>

    <section class="board-wrap" aria-label="Maze game board">
      <canvas id="maze" width="720" height="480" aria-label="Maze. Use arrow keys or W A S D to move the player from the green start to the gold exit."></canvas>
      <div class="overlay" id="win-overlay" hidden>
        <div class="overlay-card" role="dialog" aria-labelledby="win-title" aria-describedby="win-message">
          <div class="win-mark" aria-hidden="true">🏆</div>
          <h2 id="win-title">You made it!</h2>
          <p id="win-message">Great navigating. Ready for another maze?</p>
          <button class="button" id="next-level">Next maze <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <div class="controls">
      <div class="settings">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="11">Easy · 11 × 7</option>
          <option value="17" selected>Medium · 17 × 11</option>
          <option value="25">Hard · 25 × 15</option>
        </select>
      </div>
      <button class="button" id="new-maze"><span aria-hidden="true">↻</span> New maze</button>
    </div>

    <div class="mobile-controls" aria-label="Movement controls">
      <button type="button" data-dir="up" aria-label="Move up">↑</button>
      <button type="button" data-dir="left" aria-label="Move left">←</button>
      <button type="button" data-dir="down" aria-label="Move down">↓</button>
      <button type="button" data-dir="right" aria-label="Move right">→</button>
    </div>
    <p class="hint">Move with <kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd> or <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></p>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#maze");
      const ctx = canvas.getContext("2d");
      const timerEl = document.querySelector("#timer");
      const stepsEl = document.querySelector("#steps");
      const levelEl = document.querySelector("#level");
      const difficultyEl = document.querySelector("#difficulty");
      const overlay = document.querySelector("#win-overlay");
      const winMessage = document.querySelector("#win-message");
      const columns = 37;
      const rows = 25;
      const directions = [
        { x: 0, y: -1, key: "up" },
        { x: 1, y: 0, key: "right" },
        { x: 0, y: 1, key: "down" },
        { x: -1, y: 0, key: "left" }
      ];

      let cellSize = 18;
      let maze = [];
      let player = { x: 1, y: 1 };
      let exit = { x: 0, y: 0 };
      let steps = 0;
      let level = 1;
      let startedAt = 0;
      let timerId = null;
      let finished = false;

      function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
        const seconds = (totalSeconds % 60).toString().padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      function updateTimer() {
        if (!startedAt || finished) return;
        timerEl.textContent = formatTime(Math.floor((Date.now() - startedAt) / 1000));
      }

      function resizeCanvas() {
        const availableWidth = canvas.parentElement.clientWidth;
        const availableHeight = Math.max(250, Math.min(480, availableWidth * 0.68));
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(availableWidth * dpr);
        canvas.height = Math.round(availableHeight * dpr);
        canvas.style.width = `${availableWidth}px`;
        canvas.style.height = `${availableHeight}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cellSize = Math.min(availableWidth / columns, availableHeight / rows);
        draw();
      }

      function generateMaze() {
        const requestedColumns = Number(difficultyEl.value);
        const requestedRows = Math.round(requestedColumns * 7 / 11);
        const width = Math.min(columns, requestedColumns);
        const height = Math.min(rows, requestedRows) - (requestedRows % 2 === 0 ? 1 : 0);
        maze = Array.from({ length: height }, () => Array(width).fill(1));

        const stack = [{ x: 1, y: 1 }];
        maze[1][1] = 0;
        while (stack.length) {
          const current = stack[stack.length - 1];
          const options = directions
            .map(({ x, y }) => ({ x: current.x + x * 2, y: current.y + y * 2, dx: x, dy: y }))
            .filter(({ x, y }) => x > 0 && y > 0 && x < width - 1 && y < height - 1 && maze[y][x] === 1);

          if (!options.length) {
            stack.pop();
            continue;
          }

          const next = options[Math.floor(Math.random() * options.length)];
          maze[current.y + next.dy][current.x + next.dx] = 0;
          maze[next.y][next.x] = 0;
          stack.push({ x: next.x, y: next.y });
        }

        player = { x: 1, y: 1 };
        exit = { x: width - 2, y: height - 2 };
        steps = 0;
        startedAt = 0;
        finished = false;
        stepsEl.textContent = "0";
        timerEl.textContent = "00:00";
        levelEl.textContent = level.toString().padStart(2, "0");
        overlay.hidden = true;
        window.clearInterval(timerId);
        draw();
      }

      function draw() {
        if (!ctx || !maze.length) return;
        const cssWidth = canvas.clientWidth;
        const cssHeight = canvas.clientHeight;
        const width = maze[0].length;
        const height = maze.length;
        const size = Math.min(cssWidth / width, cssHeight / height);
        const offsetX = (cssWidth - width * size) / 2;
        const offsetY = (cssHeight - height * size) / 2;

        ctx.clearRect(0, 0, cssWidth, cssHeight);
        ctx.fillStyle = "#111824";
        ctx.fillRect(0, 0, cssWidth, cssHeight);

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const px = offsetX + x * size;
            const py = offsetY + y * size;
            if (maze[y][x] === 1) {
              ctx.fillStyle = "#303b50";
              ctx.fillRect(px + .7, py + .7, size - 1.4, size - 1.4);
              ctx.fillStyle = "#ffffff08";
              ctx.fillRect(px + 1, py + 1, size - 2, Math.max(2, size * .09));
            } else {
              ctx.fillStyle = "#182231";
              ctx.fillRect(px, py, size, size);
            }
          }
        }

        const exitX = offsetX + (exit.x + .5) * size;
        const exitY = offsetY + (exit.y + .5) * size;
        ctx.save();
        ctx.shadowColor = "#ffd477";
        ctx.shadowBlur = size * .9;
        ctx.fillStyle = "#ffd477";
        ctx.beginPath();
        ctx.arc(exitX, exitY, size * .31, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = "#fff1bf";
        ctx.beginPath();
        ctx.arc(exitX, exitY, size * .12, 0, Math.PI * 2);
        ctx.fill();

        const playerX = offsetX + (player.x + .5) * size;
        const playerY = offsetY + (player.y + .5) * size;
        ctx.save();
        ctx.shadowColor = "#85f0c1";
        ctx.shadowBlur = size * .75;
        ctx.fillStyle = "#85f0c1";
        ctx.beginPath();
        ctx.arc(playerX, playerY, size * .31, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = "#eafff5";
        ctx.beginPath();
        ctx.arc(playerX, playerY, size * .12, 0, Math.PI * 2);
        ctx.fill();
      }

      function move(direction) {
        if (finished) return;
        const delta = directions.find(({ key }) => key === direction);
        if (!delta) return;
        const nextX = player.x + delta.x;
        const nextY = player.y + delta.y;
        if (!maze[nextY] || maze[nextY][nextX] !== 0) return;

        if (!startedAt) {
          startedAt = Date.now();
          timerId = window.setInterval(updateTimer, 250);
        }
        player = { x: nextX, y: nextY };
        steps++;
        stepsEl.textContent = String(steps);
        draw();

        if (player.x === exit.x && player.y === exit.y) {
          finished = true;
          updateTimer();
          window.clearInterval(timerId);
          winMessage.textContent = `You escaped in ${timerEl.textContent} with ${steps} ${steps === 1 ? "step" : "steps"}.`;
          overlay.hidden = false;
          document.querySelector("#next-level").focus();
        }
      }

      document.addEventListener("keydown", (event) => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
          event.preventDefault();
        }
        const key = event.key.toLowerCase();
        const keyMap = {
          arrowup: "up", w: "up",
          arrowright: "right", d: "right",
          arrowdown: "down", s: "down",
          arrowleft: "left", a: "left"
        };
        if (keyMap[key]) move(keyMap[key]);
      });

      document.querySelectorAll(".mobile-controls button").forEach((button) => {
        button.addEventListener("click", () => move(button.dataset.dir));
      });
      document.querySelector("#new-maze").addEventListener("click", generateMaze);
      document.querySelector("#next-level").addEventListener("click", () => {
        level++;
        generateMaze();
      });
      difficultyEl.addEventListener("change", generateMaze);
      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
      generateMaze();
    })();
  </script>
</body>
</html>
